spring.application.name=visa-processing-agency
server.port=${SERVER_PORT:8082}
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Match the radio option that actually succeeds in SQL Developer:
# SID=xe          -> jdbc:oracle:thin:@localhost:1521:xe
# Service name=xe -> jdbc:oracle:thin:@//localhost:1521/xe
# Override DB_URL for another host, port, SID, or service name.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521:xe}
spring.datasource.username=${DB_USERNAME:SYSTEM}
spring.datasource.password=${DB_PASSWORD:system}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.pool-name=VisaAgencyPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.storage.root=${FILE_STORAGE_DIR:./data/uploads}
app.storage.max-file-size=${MAX_UPLOAD_BYTES:10485760}
app.storage.allowed-extensions=pdf,png,jpg,jpeg
app.storage.allowed-content-types=application/pdf,image/png,image/jpeg

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
server.error.include-message=never
server.error.include-binding-errors=never
logging.level.org.springframework.security=INFO
logging.level.com.nahidglobal=INFO

# Real Google Meet API requires user OAuth2 refresh token with meetings.space.created scope.
# Leave these empty until the agency authorizes a Google account.
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.refresh-token=${GOOGLE_REFRESH_TOKEN:}

# Local date-time inputs for appointments are interpreted in this time zone.
app.time-zone=${APP_TIME_ZONE:Asia/Dhaka}
